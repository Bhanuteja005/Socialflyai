name: Bug report
description: Something isn't working as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go to [SECURITY.md](https://github.com/Bhanuteja005/Socialflyai/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect a LinkedIn channel
        2. Schedule a post with two images
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - API
        - Auth / sign-in
        - Publishing / worker
        - Platform integration
        - Self-hosting / Docker / deployment
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Social platform (if any)
      placeholder: LinkedIn, Instagram, X, ...
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove tokens and personal data first.
      render: shell
