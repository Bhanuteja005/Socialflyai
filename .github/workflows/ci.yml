name: CI

# Runs on every branch and PR, and is called by deploy.yml as the gate before any
# image is built — production deploys run exactly the checks a PR does.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13 # keep in sync with package.json "packageManager" and the Dockerfiles

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real dependencies, not mocks: the integration suites exercise SQL, BullMQ and
    # presigned uploads for real. Host ports match the local compose file, so the
    # test setups need no CI-specific configuration.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: socialfly
          POSTGRES_PASSWORD: socialfly
          POSTGRES_DB: socialfly_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U socialfly" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: socialfly
          RUSTFS_SECRET_KEY: socialfly-dev-secret
        ports: ["9000:9000"]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        # Fails instead of silently resolving a different tree when bun.lock is stale.
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        # Every workspace: packages share types (db schema, queue payloads, API
        # routes → web client), so one change can break a consumer elsewhere.
        run: bun run typecheck

      - name: Prepare test services
        env:
          PGPASSWORD: socialfly
          AWS_ACCESS_KEY_ID: socialfly
          AWS_SECRET_ACCESS_KEY: socialfly-dev-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          psql -h localhost -p 5434 -U socialfly -d socialfly_test \
            -c "create extension if not exists vector; create extension if not exists pg_trgm; create extension if not exists citext;"
          for i in $(seq 1 30); do aws --endpoint-url http://localhost:9000 s3api list-buckets >/dev/null 2>&1 && break; sleep 1; done
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket socialfly-media

      - name: Test
        run: bun run test

      - name: Migrations are committed
        # A schema change without a generated migration would pass every test above
        # (tests migrate from the committed SQL) and then break production.
        env:
          DATABASE_URL: postgres://socialfly:socialfly@localhost:5434/socialfly_test
        run: |
          cd packages/db
          bunx drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run: bun run cli db generate <name>"
            git status --porcelain drizzle
            exit 1
          fi

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: next build
        run: bun run build --filter=@socialfly/web

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, port: "4400", dockerfile: infra/docker/service.Dockerfile }
          - { app: auth, port: "4800", dockerfile: infra/docker/service.Dockerfile }
          - { app: worker, port: "4500", dockerfile: infra/docker/service.Dockerfile }
          - { app: web, port: "3000", dockerfile: infra/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
            PORT=${{ matrix.port }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
